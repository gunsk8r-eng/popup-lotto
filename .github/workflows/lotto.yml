# ดึงผลหวย (รัฐบาล ลาว ฮานอย หุ้น ออมสิน ธ.ก.ส. มาเลย์) มาอัปเดต lotto.json อัตโนมัติ
name: update-lotto

on:
  schedule:
    # ทุกวัน 15:00–22:59 เวลาไทย ทุก 15 นาที (หวยรัฐบาล ฮานอย ลาว มาเลย์ หุ้นเอเชีย ออกช่วงนี้)
    - cron: "*/15 8-15 * * *"
    # นอกช่วงนั้น เช็คชั่วโมงละครั้ง (หุ้นยุโรป ~23:30 น., ดาวโจนส์ ~04:00 น., ออมสิน ฯลฯ)
    - cron: "7 0-7,16-23 * * *"
  workflow_dispatch: # กดรันเองได้ที่แท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update-lotto.js
      - name: บันทึกถ้าผลเปลี่ยน
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add lotto.json
          git diff --cached --quiet || (git commit -m "update lotto.json" && git push)
