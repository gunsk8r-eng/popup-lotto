# ดึงผลหวยจากกองสลากมาอัปเดต lotto.json อัตโนมัติ
name: update-lotto

on:
  schedule:
    # วันหวยออก (1, 2, 16, 17, 30, 31) ช่วง 15:00–18:59 เวลาไทย ทุก 15 นาที
    - cron: "*/15 8-11 1,2,16,17,30,31 * *"
    # วันอื่นๆ เช็ควันละครั้ง ตี 1 เวลาไทย
    - cron: "0 18 * * *"
  workflow_dispatch: # กดรันเองได้ที่แท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update-lotto.js
      - name: บันทึกถ้าผลเปลี่ยน
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          git add lotto.json
          git diff --cached --quiet || (git commit -m "update lotto.json" && git push)
